<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Number Lookup</title>
<style>
body{
    font-family:Arial;
    max-width:700px;
    margin:40px auto;
    padding:20px;
}
input{
    width:100%;
    padding:12px;
    margin-bottom:10px;
}
button{
    padding:12px 20px;
    cursor:pointer;
}
pre{
    background:#f4f4f4;
    padding:15px;
    overflow:auto;
}
</style>
</head>
<body>
<h2>Number Lookup</h2>
<input
    id="mobile"
    placeholder="Enter Number"
/>

<input
    id="accessKey"
    placeholder="Enter Access Key"
/>

<button onclick="lookup()">
Search
</button>

<pre id="result"></pre>


<h2> By creators of <a href="https://studentdb-cms.vercel.app/">Student DB lookup,</a> <a href="https://pmsecurity.online/">PM Securities</a></h2>
<br>
<p>
1. Do not include +91 at the beggining<br><br>
2. Once a aces key is locked on a ip only the admin can change it, if u accidently have done it, please contact you acess key supplier<br><br>
3. There should be no spaces like 1234567890<br><br>

</p>
<br>
<script>

async function lookup() {

    const mobile =
      document.getElementById("mobile").value.trim();

    const accessKey =
      document.getElementById("accessKey").value.trim();

    const result =
      document.getElementById("result");

    result.textContent = "Loading...";

    try {

        const response = await fetch(
          "https://ltifkzmhynhaawutlcjt.supabase.co/functions/v1/bright-service",
          {
            method:"POST",
            headers:{
              "Content-Type":"application/json"
            },
            body:JSON.stringify({
              mobile,
              accessKey
            })
          }
        );

        const data = await response.json();

        result.textContent =
          JSON.stringify(data,null,2);

    } catch(err) {

        result.textContent =
          err.message;

    }
}

</script>

</body>
</html>
